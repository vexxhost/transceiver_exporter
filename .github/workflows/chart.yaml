name: chart

on:
  pull_request:
    paths:
      - charts/**
      - mixin/**
      - hack/**
      - .github/workflows/chart.yaml
  push:
    branches:
      - main
    paths:
      - charts/**
      - mixin/**
      - hack/**
      - .github/workflows/chart.yaml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Package chart
        run: helm package charts/transceiver-exporter --destination .cr-release-packages

      - name: Upload packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: transceiver-exporter-chart
          path: .cr-release-packages/*.tgz

  release:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - package
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Publish chart
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
